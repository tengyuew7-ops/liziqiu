name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/cloudbase/function/package-lock.json
      - name: Install backend dependencies
        run: npm ci
        working-directory: backend/cloudbase/function
      - name: Run tests
        run: npm test
      - name: Check JavaScript syntax
        run: npm run check
