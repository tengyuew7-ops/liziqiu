name: Bug 报告
description: 报告可复现的问题
title: "[Bug] "
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 请描述实际结果和预期结果。
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开……
        2. 输入……
        3. 点击……
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 环境
      description: 设备、系统、浏览器或微信版本。
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: 补充信息
      description: 可附截图或控制台错误；请先去除密钥和个人数据。
